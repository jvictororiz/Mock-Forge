<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24242c"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>

    <linearGradient id="braceMain" x1="48" y1="140" x2="464" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66e8b0"/>
      <stop offset="0.5" stop-color="#49cc90"/>
      <stop offset="1" stop-color="#279866"/>
    </linearGradient>

    <linearGradient id="steelTop" x1="142" y1="108" x2="368" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ececf2"/>
      <stop offset="1" stop-color="#a8a8b4"/>
    </linearGradient>

    <linearGradient id="steelFront" x1="142" y1="188" x2="368" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2d2dc"/>
      <stop offset="1" stop-color="#6e6e7a"/>
    </linearGradient>

    <linearGradient id="steelPeen" x1="352" y1="128" x2="448" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcbcc8"/>
      <stop offset="1" stop-color="#585866"/>
    </linearGradient>

    <linearGradient id="wood" x1="244" y1="278" x2="268" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8aa6e"/>
      <stop offset="0.55" stop-color="#a8743f"/>
      <stop offset="1" stop-color="#5f3f22"/>
    </linearGradient>

    <linearGradient id="woodSheen" x1="252" y1="292" x2="258" y2="585" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sparkWarm" x1="84" y1="108" x2="132" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff9f2e"/>
    </linearGradient>

    <filter id="sparkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Braces -->
  <g filter="url(#drop)">
    <text
      x="82"
      y="312"
      text-anchor="middle"
      fill="url(#braceMain)"
      font-family="SF Mono, Menlo, Monaco, Consolas, Liberation Mono, monospace"
      font-size="208"
      font-weight="600"
    >{</text>
    <text
      x="430"
      y="312"
      text-anchor="middle"
      fill="url(#braceMain)"
      font-family="SF Mono, Menlo, Monaco, Consolas, Liberation Mono, monospace"
      font-size="208"
      font-weight="600"
    >}</text>
  </g>

  <!-- Centered cross-peen hammer -->
  <g filter="url(#drop)" transform="translate(256 256) scale(0.68) rotate(-32) translate(-256 -256)">
    <g transform="translate(14 -10)">
    <g transform="translate(12 0)">
    <!-- Handle -->
