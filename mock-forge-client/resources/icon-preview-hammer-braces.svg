    />
    <g opacity="0.34" stroke="#3a2818" stroke-width="2.5" stroke-linecap="round">
      <path d="M 244 318 C 252 316, 260 316, 268 318"/>
      <path d="M 243 364 C 252 362, 260 362, 269 364"/>
      <path d="M 242 410 C 252 408, 260 408, 270 410"/>
      <path d="M 242 456 C 252 454, 260 454, 270 456"/>
