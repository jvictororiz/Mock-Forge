    />

    <!-- Edge highlights -->
    <path stroke="#ffffff" stroke-opacity="0.52" stroke-width="3.5" stroke-linecap="round" d="M 150 130 H 352"/>
    <path stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" d="M 368 156 H 432"/>
    <path stroke="#000000" stroke-opacity="0.24" stroke-width="3" stroke-linecap="round" d="M 124 272 H 360"/>

    <!-- Sparks at hammer extremes -->
    <!-- Top -->
