      <circle cx="116" cy="272" r="3.4" fill="#ffffff" opacity="1"/>

      <path stroke="url(#sparkWarm)" stroke-width="4.8" stroke-linecap="round" d="M 116 272 L 88 300"/>
      <path stroke="#fff1b8" stroke-width="4.2" stroke-linecap="round" d="M 116 272 L 96 290"/>
      <path stroke="#ffc857" stroke-width="4.4" stroke-linecap="round" d="M 116 272 L 134 294"/>
      <path stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" d="M 116 272 L 102 286"/>
