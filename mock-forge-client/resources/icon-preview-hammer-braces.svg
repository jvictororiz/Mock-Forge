      <path fill="#ffffff" d="M 138 298 L 140.4 303.4 L 145.8 306.2 L 140.4 309 L 138 314.4 L 135.6 309 L 130.2 306.2 L 135.6 303.4 Z"/>
      <path fill="#fff7d6" d="M 146 308 L 148.1 312.4 L 152.3 314.8 L 148.1 317.2 L 146 321.6 L 143.9 317.2 L 139.7 314.8 L 143.9 312.4 Z"/>
