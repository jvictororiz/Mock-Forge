name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mock-forge-client

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json
        id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag $TAG does not match package.json version $VERSION"
              exit 1
            fi
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mock-forge-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            mock-forge-client/dist/MockForge-*-win-*-setup.exe
            mock-forge-client/dist/MockForge-*-win-*-portable.exe

  build-macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mock-forge-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            mock-forge-client/dist/MockForge-*-mac-*.dmg
            mock-forge-client/dist/MockForge-*-mac-*.zip

  publish:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Homebrew cask
        run: |
          shopt -s nullglob
          DMGS=(artifacts/MockForge-*-mac-*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "No macOS DMG artifacts found"
            exit 1
          fi
          ARGS=()
          for dmg in "${DMGS[@]}"; do
            ARGS+=(--dmg "$dmg")
          done
          node mock-forge-client/scripts/generate-cask.js \
            --version "${{ needs.version.outputs.version }}" \
            --out artifacts/mockforge.rb \
            "${ARGS[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: MockForge ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/MockForge-*-win-*-setup.exe
            artifacts/MockForge-*-win-*-portable.exe
            artifacts/MockForge-*-mac-*.dmg
            artifacts/MockForge-*-mac-*.zip
            artifacts/mockforge.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
