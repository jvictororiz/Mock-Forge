name: Release

# Desktop app only. Triggered by version tags — not by marketing site changes.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mock-forge-client

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json
        id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag $TAG does not match package.json version $VERSION"
              exit 1
            fi
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mock-forge-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            mock-forge-client/dist/MockForge-win-*-setup.exe
            mock-forge-client/dist/MockForge-win-*-portable.exe

  build-macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          # Intel runner so the bundled JRE matches the package arch.
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    # Fail fast: a healthy Mac build should finish well under 15 minutes locally.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mock-forge-client/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('mock-forge-client/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Clean packaging artifacts
        run: npm run clean:packaging

      - name: Build app
        run: npm run build

      - name: Download scrcpy server
        run: npm run download-scrcpy-server

      - name: Download bundled JRE
        run: npm run download-jre

      - name: Prepare JRE for packaging
        run: npm run prepare-jre-for-build

      - name: Package macOS ${{ matrix.arch }} (electron-builder)
        run: npm run build:mac:ci -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            mock-forge-client/dist/MockForge-mac-*.dmg
            mock-forge-client/dist/MockForge-mac-*.zip

  publish:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Homebrew cask
        run: |
          shopt -s nullglob
          DMGS=(artifacts/MockForge-mac-*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "No macOS DMG artifacts found"
            exit 1
          fi
          ARGS=()
          for dmg in "${DMGS[@]}"; do
            ARGS+=(--dmg "$dmg")
          done
          node mock-forge-client/scripts/generate-cask.js \
            --version "${{ needs.version.outputs.version }}" \
            --out artifacts/mockforge.rb \
            "${ARGS[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: MockForge ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/MockForge-win-*-setup.exe
            artifacts/MockForge-win-*-portable.exe
            artifacts/MockForge-mac-*.dmg
            artifacts/MockForge-mac-*.zip
            artifacts/mockforge.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
